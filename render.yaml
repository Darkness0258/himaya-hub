# Deploys the hub to Render (free plan). Read docs/DEPLOY.md first: the free plan sleeps when idle and
# has NO permanent disk, so set DATABASE_URL (e.g. a free Supabase project) or devices must re-enroll.
services:
  - type: web
    name: himaya-hub
    runtime: docker
    dockerfilePath: ./hub/Dockerfile
    dockerContext: ./hub
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HIMAYA_PUBLIC_URL
        value: "https://himaya-hub.onrender.com"   # change to your service's URL
      - key: HIMAYA_ADMIN_KEY
        generateValue: true                        # Render creates a random key; read it in the service's Environment tab
      - key: DATABASE_URL
        sync: false                                # paste your PostgreSQL / Supabase connection string
