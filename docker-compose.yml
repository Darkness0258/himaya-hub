# Himaya - run the hub in Docker:   docker compose up -d --build
# Optional website filtering for the whole network with AdGuard Home:   docker compose --profile adguard up -d
services:
  himaya-hub:
    build:
      context: ./hub
    container_name: himaya-hub
    ports:
      - "8000:8000"        # dashboard + API
      - "5300:5300/udp"    # website-filtering DNS (use HIMAYA_DNS_PORT=53 + "53:53/udp" to serve real DNS)
      - "5354:5354/udp"    # LAN discovery (works best with network_mode: host on Linux)
    environment:
      PORT: "8000"
      HIMAYA_DNS_PORT: "5300"
      HIMAYA_LAN_IP: "${HIMAYA_LAN_IP:-}"
      HIMAYA_ADMIN_KEY: "${HIMAYA_ADMIN_KEY:-}"
      HIMAYA_PUBLIC_URL: "${HIMAYA_PUBLIC_URL:-}"
      HIMAYA_TIMEZONE: "${HIMAYA_TIMEZONE:-UTC}"
      DATABASE_URL: "${DATABASE_URL:-}"
      RENDER: "false"
    volumes:
      - himaya-data:/app/data      # database, screenshots, admin key
    restart: unless-stopped

  # Optional: network-wide DNS filtering. Needs host port 53 free (on Ubuntu: stop systemd-resolved's stub listener).
  adguard:
    profiles: ["adguard"]
    image: adguard/adguardhome:latest
    container_name: himaya-adguard
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"    # first-run setup wizard - create the admin account there
      - "8080:80/tcp"      # admin UI after setup
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    restart: unless-stopped

  # Optional: automatic image updates
  watchtower:
    profiles: ["tools"]
    image: containrrr/watchtower:latest
    container_name: himaya-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
    restart: unless-stopped

volumes:
  himaya-data:

networks:
  default:
    name: himaya-network
