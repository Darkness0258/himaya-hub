services:
  - type: web
    name: himaya-hub
    runtime: docker
    dockerfilePath: ./hub/Dockerfile
    dockerContext: ./hub
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HIMAYA_PUBLIC_URL
        value: "https://himaya-hub.onrender.com"
      - key: DATABASE_URL
        sync: false
